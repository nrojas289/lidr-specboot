openapi: 3.0.3
info:
  title: Example Books API
  version: 1.0.0
  description: |
    Template contract for the backend-api pack. Replace the example resource with your own.
    This file is the reviewed contract: update it in the spec phase of an OpenSpec change,
    and keep the Swagger document generated by @nestjs/swagger in sync with it.
servers:
  - url: http://localhost:3000/v1
security:
  - bearerAuth: []
paths:
  /books:
    get:
      tags: [books]
      summary: List books (paginated)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated list of books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [books]
      summary: Create a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBook'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /books/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [books]
      summary: Get a book by id
      responses:
        '200':
          description: The book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [books]
      summary: Update a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBook'
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [books]
      summary: Delete a book (soft delete)
      responses:
        '204':
          description: Book deleted
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    Book:
      type: object
      required: [id, title, isbn, publishedYear, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        isbn: { type: string, example: '9780132350884' }
        publishedYear: { type: integer, minimum: 1450 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateBook:
      type: object
      required: [title, isbn, publishedYear]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        isbn: { type: string, pattern: '^[0-9]{13}$' }
        publishedYear: { type: integer, minimum: 1450 }
    UpdateBook:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        publishedYear: { type: integer, minimum: 1450 }
    BookPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Book' }
        meta:
          type: object
          required: [page, limit, total]
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
    Error:
      type: object
      required: [statusCode, error, message, path, timestamp]
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        path: { type: string }
        timestamp: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Unique constraint violated (e.g. duplicate ISBN)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
