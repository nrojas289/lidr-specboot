# Template GraphQL contract for the backend-api pack (code-first projects).
# This file is the reviewed contract: update it in the spec phase of an OpenSpec change.
# The schema generated by @nestjs/graphql (src/schema.gql, sortSchema: true) must match it.
# Replace the example types with your own. Delete this file if the API style is "rest".

"""A book in the catalog."""
type Book {
  id: ID!
  title: String!
  isbn: String!
  publishedYear: Int!
  author: Author!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Author {
  id: ID!
  name: String!
  books(first: Int = 20, after: String): BookConnection!
}

"""Cursor-based pagination (Relay-style connection)."""
type BookConnection {
  edges: [BookEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type BookEdge {
  cursor: String!
  node: Book!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

input CreateBookInput {
  title: String!
  isbn: String!
  publishedYear: Int!
  authorId: ID!
}

input UpdateBookInput {
  title: String
  publishedYear: Int
}

type Query {
  """Returns null when the book does not exist."""
  book(id: ID!): Book
  books(first: Int = 20, after: String): BookConnection!
}

type Mutation {
  """Errors: BAD_USER_INPUT (validation), CONFLICT (duplicate ISBN), UNAUTHENTICATED."""
  createBook(input: CreateBookInput!): Book!
  """Errors: BAD_USER_INPUT, NOT_FOUND, UNAUTHENTICATED."""
  updateBook(id: ID!, input: UpdateBookInput!): Book!
  """Soft delete. Errors: NOT_FOUND, UNAUTHENTICATED, FORBIDDEN."""
  deleteBook(id: ID!): Boolean!
}

"""ISO-8601 date-time string."""
scalar DateTime
